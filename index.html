<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Rescue</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; }
      canvas { display: block; }
      #controls-hint {
        position: fixed; left: 16px; bottom: 14px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8fa2c4; pointer-events: none; user-select: none;
      }
      #controls-hint b { color: #dce4f2; font-weight: 600; }
      #controls-hint[data-device="keyboard"] .for-gamepad { display: none; }
      #controls-hint[data-device="gamepad"] .for-keyboard { display: none; }
      #status {
        position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
        font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em; color: #071410;
        background: #5fd39a; padding: 10px 18px; border-radius: 999px;
        opacity: 0; transition: opacity 140ms ease;
        pointer-events: none; user-select: none;
      }
      #status.is-visible { opacity: 1; }
      #status.is-flash { background: #f0c674; }
      #score {
        position: fixed; right: 18px; top: 16px;
        font: 600 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; color: #dce4f2;
        background: rgba(20, 27, 41, 0.72); padding: 9px 14px; border-radius: 8px;
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="score">RESCUED 0</div>
    <div id="status"></div>
    <div id="controls-hint" data-device="keyboard">
      <span class="for-keyboard">
        <b>W S</b> nose down / up &nbsp;·&nbsp; <b>A D</b> turn &nbsp;·&nbsp; <b>Q E</b> slide &nbsp;·&nbsp; <b>Space</b> climb &nbsp;·&nbsp; <b>Shift</b> descend
      </span>
      <span class="for-gamepad">
        <b>Left stick</b> nose / slide &nbsp;·&nbsp; <b>Right stick</b> turn &nbsp;·&nbsp; <b>RT</b> climb &nbsp;·&nbsp; <b>LT</b> descend
      </span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

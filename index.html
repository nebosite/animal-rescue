<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Rescue</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10131a; }
      canvas { display: block; }
      #controls-hint {
        position: fixed; left: 16px; bottom: 14px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8fa2c4; pointer-events: none; user-select: none;
      }
      #controls-hint b { color: #dce4f2; font-weight: 600; }
      #controls-hint[data-device="keyboard"] .for-gamepad { display: none; }
      #controls-hint[data-device="gamepad"] .for-keyboard { display: none; }
      #status {
        position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
        font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em; color: #071410;
        background: #5fd39a; padding: 10px 18px; border-radius: 999px;
        opacity: 0; transition: opacity 140ms ease;
        pointer-events: none; user-select: none;
      }
      #course {
        position: fixed; right: 18px; top: 96px;
        display: flex; align-items: center; gap: 10px;
        background: rgba(20, 27, 41, 0.72); padding: 8px 14px; border-radius: 8px;
        font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em; color: #dce4f2;
        pointer-events: none; user-select: none;
      }
      #compass { font-size: 17px; line-height: 1; color: #5fd39a; transition: transform 90ms linear; }
      #audio-controls {
        position: fixed; right: 18px; top: 54px;
        display: flex; align-items: center; gap: 8px;
        background: rgba(20, 27, 41, 0.72); padding: 6px 10px; border-radius: 8px;
        user-select: none;
      }
      #mute {
        font: 16px/1 system-ui, sans-serif; width: 32px; height: 28px;
        background: transparent; border: 0; border-radius: 6px; color: #dce4f2; cursor: pointer;
      }
      #mute:hover { background: rgba(255, 255, 255, 0.08); }
      #mute.is-muted { opacity: 0.6; }
      #volume { width: 96px; accent-color: #5fd39a; cursor: pointer; }
      #status.is-visible { opacity: 1; }
      #status.is-flash { background: #f0c674; }
      #radio {
        position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%);
        max-width: min(680px, calc(100vw - 32px));
        font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e6ecf7; background: rgba(20, 27, 41, 0.86);
        border: 1px solid rgba(143, 162, 196, 0.35); border-radius: 10px;
        padding: 10px 16px; opacity: 0; transition: opacity 160ms ease;
        pointer-events: none; user-select: none;
      }
      #radio.is-visible { opacity: 1; }
      #radio-speaker { font-weight: 700; letter-spacing: 0.08em; margin-right: 10px; color: #f0c674; }
      #radio[data-speaker="chief"] #radio-speaker { color: #ff9f6b; }
      #score {
        position: fixed; right: 18px; top: 16px;
        font: 600 14px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; color: #dce4f2;
        background: rgba(20, 27, 41, 0.72); padding: 9px 14px; border-radius: 8px;
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="score">SCORE 0</div>
    <div id="course"><span id="compass">▲</span><span id="range">0 m</span></div>
    <div id="radio" aria-live="polite"><span id="radio-speaker"></span><span id="radio-text"></span></div>
    <div id="audio-controls">
      <button id="mute" type="button" aria-label="Mute">🔊</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
    </div>
    <div id="status"></div>
    <div id="controls-hint" data-device="keyboard">
      <span class="for-keyboard">
        <b>W S</b> nose down / up &nbsp;·&nbsp; <b>Q E</b> turn &nbsp;·&nbsp; <b>← →</b> slide &nbsp;·&nbsp; <b>A</b> climb &nbsp;·&nbsp; <b>Z</b> descend
      </span>
      <span class="for-gamepad">
        <b>Left stick</b> nose / slide &nbsp;·&nbsp; <b>Right stick</b> turn &nbsp;·&nbsp; <b>RT</b> climb &nbsp;·&nbsp; <b>LT</b> descend
      </span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
